<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CLUB LEGACY · Carreira</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="career-entry" aria-label="Criar carreira"></section>
    <aside id="sidebar" hidden>
      <h1>CLUB<span>LEGACY</span></h1>
      <small>SEU CLUBE. SUA HISTÓRIA.</small>
      <nav id="nav" aria-label="Menu principal"></nav>
      <p class="foot">
        TREINADOR & GESTOR<br /><span>Clubes reais · carreira simulada</span>
      </p>
    </aside>
    <main id="game" hidden>
      <header>
        <div>
          <small id="context">CENTRAL DO TREINADOR</small>
          <h2 id="title"></h2>
          <p id="page-description" class="page-description"></p>
        </div>
        <div class="header-actions">
          <button
            data-action="quick-menu"
            id="navigation-search"
            aria-keyshortcuts="Control+k Meta+k"
          >
            Menu e busca
          </button>
          <button
            data-action="toggle-sidebar"
            id="sidebar-toggle"
            aria-controls="sidebar"
            aria-expanded="true"
            title="Recolher ou expandir menu lateral"
          >
            ☰
          </button>
          <button id="match-day" data-page="Dia de jogo" class="primary" hidden>
            Dia de jogo
          </button>
          <button id="theme-toggle" data-action="toggle-theme">
            Modo claro
          </button>
          <button id="export">Exportar carreira</button
          ><button id="save">Salvar carreira</button
          ><small id="save-status" aria-live="polite">Salvo</small>
        </div>
      </header>
      <section id="time-controls" aria-label="Avanço de tempo"></section>
      <section id="content"></section>
    </main>
    <div id="notification" class="notice" role="status" hidden></div>
    <dialog id="deal" aria-label="Negociação de jogador">
      <form id="deal-form"></form>
    </dialog>
    <dialog
      id="calendar-dialog"
      aria-label="Planejamento de amistosos"
    ></dialog>
    <dialog id="quick-menu" aria-label="Navegação rápida"></dialog>
    <dialog id="trophy-dialog" aria-label="Comemoração de título"></dialog>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <dialog id="save-dialog" aria-label="Gerenciar carreira">
      <div id="save-dialog-content"></div>
    </dialog>
    <script src="vendor/lz-string.js"></script>
    <script src="world.js"></script>
    <script src="calendar-data.js"></script>
    <script src="appearance.js"></script>
    <script src="badges-data.js"></script>
    <script src="badges.js"></script>
    <script src="roster-data.js"></script>
    <script src="rosters.js"></script>
    <script src="money.js"></script>
    <script src="schedule.js"></script>
    <script src="training.js"></script>
    <script src="finance.js"></script>
    <script src="physical.js"></script>
    <script src="captains-data.js"></script>
    <script src="leadership.js"></script>
    <script src="tactics.js"></script>
    <script src="national.js"></script>
    <script src="scouting.js"></script>
    <script src="performance.js"></script>
    <script src="engine.js"></script>
    <script src="saves.js"></script>
    <script src="autosave.js"></script>
    <script src="vendor/three.min.js"></script>
    <script src="match-renderer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
